  <pre id="thought-panel"></pre>
  <div id="history-line"></div>
  <script src='https://patrick-ring-motive.github.io/temp-storage/script.js'></script>
  <script>
    globalThis.runEnhancement = _ => _;
    (async () => {
      await import('https://patrick-ring-motive.github.io/connect4/color.js?' + Math.random());
      //custom utils
      const isString = x => typeof x === 'string' || x instanceof String;
      const stringify = x => {
        try {
          if (isString(x)) {
            return String(x);
          }
          return String(JSON.stringify(x));
        } catch {
          return String(x);
        }
      };
      const parse = x => {
        try {
          return JSON.parse(x);
        } catch {
          return x && Object(x);
        }
      };
      const localStore = {
        get(key) {
          try {
            return parse(localStorage.getItem(key));
          } catch {
            return null;
          }
        },
        set(key, value) {
          try {
            localStorage.setItem(key, stringify(value));
          } catch {
            // ignore
          }
        },
        remove(key) {
          try {
            localStorage.removeItem(key);
          } catch {
            // ignore
          }
        },
      };
      globalThis.localMap ??= new Proxy({}, {
        get(target, prop) {
          return localStore.get(prop);
        },
        set(target, prop, value) {
          localStore.set(prop, value);
          return true;
        },
        deleteProperty(target, prop) {
          localStore.remove(prop);
          return true;
        },
      });
      // ─── Constants ────────────────────────────────────────────────────────────────
      const ROWS = 6,
        COLS = 7;
      const EMPTY = null,
        RED = "R",
        YELLOW = "Y";
      const MINIMAX_DEPTH = 4;
      const CENTER_WEIGHTS = [3, 4, 5, 7, 5, 4, 3];
      const API_BASE = "https://db.connectfour.workers.dev";
      const LOCAL_GAME_KEY = "c4_local_game";
      const SESSION_KEY = "c4_session";
      let auth = {
        checked: false,
        token: "",
        user: null,
      };
      let persistenceReady = false;
      let saveTimer = null;
      // human utils
      const documentQuerySelector = (...args) => {
        try {
          return document.querySelector(...args);
        } catch (e) {
          console.warn(e, ...args);
        }
      };
      const documentQuerySelectorAll = (...args) => {
        try {
          return [...document.querySelector(...args)];
        } catch (e) {
          console.warn(e, ...args);
          return [];
        }
      };
      const updateAttribute = (el, key, value) => {
        try {
          const val = el.getAttribute(key);
          if (val != value) {
            return el.setAttribute(key, value);
          }
        } catch (e) {
          console.warn(e, el, key, value);
        };
      };
      const updateProp = (el, key, value) => {
        try {
          if (el[key] != value) {
            return el[key] = value;
          }
        } catch (e) {
          console.warn(e, el, key, value);
        };
      };
      // ─── Board Utilities ──────────────────────────────────────────────────────────
      const emptyBoard = () => Array.from({
          length: ROWS,
        },
        () => Array(COLS).fill(EMPTY), );
      const cloneBoard = (board) => board.map((row) => [...row]);
      const dropPiece = (board, col, player) => {
        const next = cloneBoard(board);
        for (let row = ROWS - 1; row >= 0; row--) {
          if (next[row][col] === EMPTY) {
            next[row][col] = player;
            return {
              board: next,
              row,
            };
          }
        }
        return null;
      };
      const validMoves = (board) => Array.from({
          length: COLS,
        },
        (_, col) => col, ).filter((col) => board[0][col] === EMPTY);
      const checkWinner = (board) => {
        const check = (row, col, deltaRow, deltaCol, player) => {
          for (let i = 0; i < 4; i++) {
            const nextRow = row + deltaRow * i,
              nextCol = col + deltaCol * i;
            if (nextRow < 0 || nextRow >= ROWS || nextCol < 0 || nextCol >= COLS || board[nextRow][nextCol] !== player) return false;
          }
          return true;
        };
        for (let row = 0; row < ROWS; row++)
          for (let col = 0; col < COLS; col++)
            for (const player of [RED, YELLOW])
              for (const [deltaRow, deltaCol] of [
                  [0, 1],
                  [1, 0],
                  [1, 1],
                  [1, -1],
                ])
                if (check(row, col, deltaRow, deltaCol, player)) return player;
        return validMoves(board).length === 0 ? "DRAW" : null;
      };
      const getWinCells = (board) => {
        const check = (row, col, deltaRow, deltaCol, player) => {
          const cells = [];
          for (let i = 0; i < 4; i++) {
            const nextRow = row + deltaRow * i,
              nextCol = col + deltaCol * i;
            if (nextRow < 0 || nextRow >= ROWS || nextCol < 0 || nextCol >= COLS || board[nextRow][nextCol] !== player) return null;
            cells.push([nextRow, nextCol]);
          }
          return cells;
        };
        for (let row = 0; row < ROWS; row++)
          for (let col = 0; col < COLS; col++)
            for (const player of [RED, YELLOW])
              for (const [deltaRow, deltaCol] of [
                  [0, 1],
                  [1, 0],
                  [1, 1],
                  [1, -1],
                ]) {
                const cells = check(row, col, deltaRow, deltaCol, player);
                if (cells) return cells;
              }
        return [];
      };
      // ─── Heuristic ────────────────────────────────────────────────────────────────
      const scoreWindow = (cells, player) => {
        const opp = player === RED ? YELLOW : RED;
        const playerCount = cells.filter((cell) => cell === player).length;
        const emptyCount = cells.filter((cell) => cell === EMPTY).length;
        const oppCount = cells.filter((cell) => cell === opp).length;
        if (playerCount === 4) return 1000;
        if (oppCount === 4) return -1000;
        if (playerCount === 3 && emptyCount === 1) return 10;
        if (playerCount === 2 && emptyCount === 2) return 2;
        if (oppCount === 3 && emptyCount === 1) return -80;
        if (oppCount === 2 && emptyCount === 2) return -3;
        return 0;
      };
      const heuristicScore = (board, player) => {
        let score = 0;
        for (let r = 0; r < ROWS; r++)
          for (let c = 0; c < COLS; c++)
            if (board[r][c] === player) score += CENTER_WEIGHTS[c];
        for (let r = 0; r < ROWS; r++)
          for (let c = 0; c <= COLS - 4; c++) score += scoreWindow(
            [board[r][c], board[r][c + 1], board[r][c + 2], board[r][c + 3]], player, );
        for (let c = 0; c < COLS; c++)
          for (let r = 0; r <= ROWS - 4; r++) score += scoreWindow(
            [board[r][c], board[r + 1][c], board[r + 2][c], board[r + 3][c]], player, );
        for (let r = 0; r <= ROWS - 4; r++)
          for (let c = 0; c <= COLS - 4; c++) score += scoreWindow(
            [
              board[r][c],
              board[r + 1][c + 1],
              board[r + 2][c + 2],
              board[r + 3][c + 3],
            ], player, );
        for (let r = 3; r < ROWS; r++)
          for (let c = 0; c <= COLS - 4; c++) score += scoreWindow(
            [
              board[r][c],
              board[r - 1][c + 1],
              board[r - 2][c + 2],
              board[r - 3][c + 3],
            ], player, );
        return score;
      };
      // ─── Bots ─────────────────────────────────────────────────────────────────────
      const greedyMove = (board, player) => {
        const moves = validMoves(board);
        let bestScore = -Infinity,
          bestCol = moves[0];
        for (const col of moves) {
          const result = dropPiece(board, col, player);
          if (!result) continue;
          const winner = checkWinner(result.board);
          if (winner === player) return col;
          const score = heuristicScore(result.board, player);
          if (score > bestScore) {
            bestScore = score;
            bestCol = col;
          }
        }
        return bestCol;
      };
      const minimax = (board, depth, alpha, beta, maximizing, player) => {
        const opp = player === RED ? YELLOW : RED;
        const winner = checkWinner(board);
        if (winner === player) return {
          score: 10000 + depth,
        };
        if (winner === opp) return {
          score: -10000 - depth,
        };
        if (winner === "DRAW" || depth === 0) return {
          score: heuristicScore(board, player),
        };
        const moves = validMoves(board);
        let bestCol = moves[0];
        if (maximizing) {
          let best = -Infinity;
          for (const col of moves) {
            const result = dropPiece(board, col, player);
            if (!result) continue;
            const {
              score
            } = minimax(result.board, depth - 1, alpha, beta, false, player, );
            if (score > best) {
              best = score;
              bestCol = col;
            }
            alpha = Math.max(alpha, score);
            if (alpha >= beta) break;
          }
          return {
            score: best,
            col: bestCol,
          };
        } else {
          let best = Infinity;
          for (const col of moves) {
            const result = dropPiece(board, col, opp);
            if (!result) continue;
            const {
              score
            } = minimax(result.board, depth - 1, alpha, beta, true, player, );
            if (score < best) {
              best = score;
              bestCol = col;
            }
            beta = Math.min(beta, score);
            if (alpha >= beta) break;
          }
          return {
            score: best,
            col: bestCol,
          };
        }
      };
      const minimaxMove = (board, player) => minimax(board, MINIMAX_DEPTH, -Infinity, Infinity, true, player).col;
      // ─── Board Serialization (LLM hook) ──────────────────────────────────────────
      const getBoardState = (board, currentPlayer, lastMove, moveHistory) => {
        const colLabels = "0123456";
        const rowLabels = ["5", "4", "3", "2", "1", "0"];
        const header = "  " + colLabels.split("").join(" ");
        const grid = board.map(
          (row, rowIndex) => rowLabels[rowIndex] + " " + row.map((cell) => (cell === EMPTY ? "." : cell)).join(" "), ).join("\n");
        const formatted = `${header}\n${grid}`;
        const moves = validMoves(board);
        const prompt = `Connect 4 board state:\n${formatted}\n\nCurrent turn: ${currentPlayer}\nValid columns: ${moves.join(", ")}\nLast move: ${lastMove ? `${lastMove.player} played column ${lastMove.col}` : "None"}\n\nLegend: R=Red, Y=Yellow, .=Empty\nRows 0-5 (0=bottom), Columns 0-6\n\nYou are playing as ${currentPlayer}. Choose the best column.\nRespond with a single integer (0-6). No explanation.`;
        return {
          board,
          currentPlayer,
          validMoves: moves,
          lastMove,
          moveHistory,
          grid: formatted,
          prompt,
        };
      };
      async function apiFetch(path, method = "GET", body = null) {
        const res = await fetch(API_BASE + path, {
          method,
          headers: {
            ...(body == null ? {} : {
              "Content-Type": "application/json"
            }),
          },
          body: body == null ? undefined : JSON.stringify(body),
        });
        const data = await res.json().catch(() => null);
        return {
          ok: res.ok,
          status: res.status,
          data,
        };
      }

      function loadSavedSession() {
        return localMap[SESSION_KEY] || null;
      }

      function renderAuthBar() {
        const el = document.getElementById("auth-bar");
        if (!el) return;
        if (!auth.checked) {
          el.textContent = "Checking sign in...";
          return;
        }
        if (auth.user) {
          const name = auth.user.username || auth.user.email || "Signed in";
          el.innerHTML = `<span>Signed in as ${escapeHtml(name)}</span><button id="logout-btn" type="button">Log out</button>`;
          document.getElementById("logout-btn").addEventListener("click", logout);
          return;
        }
        el.innerHTML = `<span>Playing locally</span><button id="signin-btn" type="button">Sign in</button>`;
        document.getElementById("signin-btn").addEventListener("click", () => {
          window.location.href = "/auth.html";
        });
      }
      async function initAuth() {
        renderAuthBar();
        const saved = loadSavedSession();
        if (!saved?.token) {
          auth.checked = true;
          renderAuthBar();
          return;
        }
        const result = await apiFetch(`/session?token=${encodeURIComponent(saved.token)}`);
        if (result.ok && result.data?.user) {
          auth = {
            checked: true,
            token: saved.token,
            user: result.data.user,
          };
          localMap[SESSION_KEY] = {
            token: saved.token,
            user: result.data.user,
          };
        } else {
          auth = {
            checked: true,
            token: "",
            user: null,
          };
          delete localMap[SESSION_KEY];
        }
        renderAuthBar();
      }
      async function logout() {
        const token = auth.token;
        auth = {
          checked: true,
          token: "",
          user: null,
        };
        delete localMap[SESSION_KEY];
        state.gameId = null;
        state.dbMovesSaved = 0;
        saveLocalGame();
        renderAuthBar();
        render();
        if (token) {
          try {
            await apiFetch("/logout", "POST", {
              token
            });
          } catch (error) {
            console.warn("[Logout error]", error);
          }
        }
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, char => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        } [char]));
      }
      const LLAVA_URL = "https://llava-15-7b-hf-summary.language-models.workers.dev/";
      const GEMMA_URL = "https://gemma.connectfour-ai.workers.dev/";
      // Gemma conversation history (OpenAI-compatible messages format)
      let gemmaMessages = [];
      // Helper: Append text as a text node (no repaint of entire content)
      globalThis.appendTextNode = function appendTextNode(element, text) {
        text = text.replace(/(confident|stubborn|typically),?/gi, '')
          .replace(/disagree with/gi, 'consider')
          .replace(/disagree/gi, 'consider')
          .replace(/[ ]+/g, ' ')
          .replaceAll(/a\s+AI/g, 'an AI')
          .replaceAll(/and\s+and/g, 'and');
        const span = document.createElement('span');
        span.innerHTML = color(text);
        element?.appendChild?.(span);
      }
      // Helper: Clear element and set initial text
      function setTextContent(element, text) {
        (element ?? {}).textContent = text;
      }
      const fetchText = async (url, options) => {
        try {
          const res = await fetch(url, options);
          return await res.text();
        } catch (e) {
          return String(e);
        }
      };
      // LLaVA — simple fetch, return column
      const llavaMove = async (boardState) => {
        const icon = boardState.currentPlayer === RED ? "🥩" : "🧀";
        const text = await fetchText(LLAVA_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: stringify({
            prompt: boardState.prompt
          }),
        });
        const thoughtPanel = document.getElementById("thought-panel");
        let col = [...text].findLast((x) => x.match(/[0-6]/) && boardState.validMoves.includes(Number.parseInt(x, 10)));
        console.log("[LLaVA] Response:", text);
        let parsed = Number.parseInt(col, 10);
        if (Number.isNaN(parsed) || !boardState.validMoves.includes(parsed)) {
          const txt = stringify([new TextEncoder().encode(text)]);
          col = [...txt].findLast((x) => x.match(/[0-6]/) && boardState.validMoves.includes(Number.parseInt(x, 10)));
          parsed = Number.parseInt(col, 10);
          if (Number.isNaN(parsed) || !boardState.validMoves.includes(parsed)) {
            console.warn(icon + ' [LLaVA] Invalid column', parsed, '- falling back to valid move');
            parsed = boardState.validMoves[Math.floor(Math.random() * boardState.validMoves.length)];
            appendTextNode(thoughtPanel, `\n\n${icon} [LLaVA] Valid move not found, selecting random. Playing ${parsed}.`);
          } else {
            appendTextNode(thoughtPanel, `\n\n${icon} [LLaVA] Valid move not found in text.\n\n${icon} [LLaVA] Valid move found in bytes. Playing ${parsed}.`);
          }
        } else {
          appendTextNode(thoughtPanel, `\n\n${icon} [LLaVA] Valid move selected. Playing ${parsed}.`);
        }
        (thoughtPanel ?? {}).scrollTop = thoughtPanel?.scrollHeight;
        return parsed;
      };
      async function bestEffortFetch(input, init) {
        try {
          // 1. Perform the initial fetch request
          const originalResponse = await fetch(input, init);
          // If there is no body to read (e.g., 204 No Content, HEAD requests), return as-is
          if (!originalResponse.body) {
            return originalResponse;
          }
          const originalReader = originalResponse.body.getReader();
          // 2. Create a resilient wrapper stream
          const resilientStream = new ReadableStream({
            async pull(controller) {
              try {
                const {
                  done,
                  value
                } = await originalReader.read();
                if (done) {
                  controller.close();
                } else {
                  controller.enqueue(value);
                }
              } catch (streamError) {
                // A mid-stream network drop or timeout caught here!
                console.warn("Stream interrupted prematurely. Closing stream gracefully with partial data.", streamError, );
                // Cleanly close the controller instead of calling controller.error()
                controller.close();
              }
            },
            cancel(reason) {
              // Ensure the underlying reader is canceled if the consumer aborts early
              originalReader.cancel(reason).catch(() => {});
            },
          });
          // 3. Return a new Response cloning the original metadata but swapping the body
          return new Response(resilientStream, {
            status: originalResponse.status,
            statusText: originalResponse.statusText,
            headers: originalResponse.headers,
          });
        } catch (initialFetchError) {
          return new Response(String(initialFetchError));
        }
      }
      // Gemma — streaming with thought process display (OpenAI-compatible SSE)
      // botLabel param allows GemmaMax to identify itself in the thought panel
      const gemmaMove = async (boardState, botLabel = "Gemma") => {
        const thoughtPanel = document.getElementById("thought-panel");
        // Build the user message for this turn
        const userMsg = {
          role: "user",
          content: boardState.prompt
        };
        // Only send system + current board state (no history)
        const messages = [{
            role: "system",
            content: "You are a Connect 4 AI. Analyze the board and choose the best column (0-6). Think through your reasoning, then end with your chosen column number.",
          },
          userMsg,
        ];
        const icon = (boardState.currentPlayer === RED ? "🧶" : "🧇") + ` [${botLabel}]`;
        // Show streaming indicator appended to history
        const moveNum = gemmaMessages.length + 1;
        // Use a dedicated element for streaming output so only its subtree repaints
        const streamEl = document.createElement('span');
        appendTextNode(streamEl, `── Move ${moveNum} ──\n${icon} Thinking...`);
        if (thoughtPanel?.childNodes?.length) appendTextNode(thoughtPanel, "\n\n");
        thoughtPanel?.appendChild?.(streamEl);
        (thoughtPanel ?? {}).scrollTop = thoughtPanel?.scrollHeight;
        const res = await bestEffortFetch(GEMMA_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: stringify({
            messages,
            stream: true
          }),
        });
        let fullText = "";
        if (res?.body?.getReader) {
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          while (true) {
            const {
              done,
              value
            } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, {
              stream: true
            });
            const lines = buffer.split("\n");
            buffer = lines.pop();
            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed || trimmed === "data: [DONE]") continue;
              if (trimmed.startsWith("data: ")) {
                try {
                  const json = JSON.parse(trimmed.slice(6));
                  let token = json.choices?.[0]?.delta?.content || json.choices?.[0]?.text || json.response || "";
                  let parsed;
                  try {
                    parsed = JSON.parse(token);
                  } catch {}
                  if (parsed?.choices) {
                    if (parsed?.choices?.[0]?.delta?.reasoning) {
                      token = parsed?.choices?.[0]?.delta?.reasoning;
                    } else {
                      token = '';
                    }
                  }
                  fullText += token;
                } catch (e) {
                  fullText += trimmed.slice(6);
                }
              }
            }
            streamEl.textContent = '';
            appendTextNode(streamEl, `── Move ${moveNum} ──\n${icon} ${fullText}`);
            (thoughtPanel ?? {}).scrollTop = thoughtPanel?.scrollHeight;
          }
          // Process any remaining buffer
          if (buffer?.trim?.() !== "data: [DONE]" && buffer?.trim?.()?.startsWith?.("data: ")) {
            try {
              const json = JSON.parse(buffer.trim().slice(6));
              const token = json.choices?.[0]?.delta?.content || json.choices?.[0]?.text || json.response || "";
              fullText += token;
            } catch (e) {
              fullText += buffer.trim().slice(6);
            }
            streamEl.textContent = '';
            appendTextNode(streamEl, `── Move ${moveNum} ──\n${icon} ${fullText}`);
          }
        } else {
          fullText = await res.text();
          streamEl.textContent = '';
          appendTextNode(streamEl, `── Move ${moveNum} ──\n${icon} ${fullText}`);
        }
        // Add assistant response to local history for display
        gemmaMessages.push(fullText);
        console.log(`[${botLabel}] Full response:`, fullText);
        const numDict = {
          zero: 0,
          one: 1,
          two: 2,
          three: 3,
          four: 4,
          five: 5,
          six: 6
        };
        for (const n in numDict) {
          fullText = fullText.replace(RegExp(n, "gi"), numDict[n]);
        }
        fullText = fullText.replace(/(connect|depth)\s*4/gi, '$1 ④').replace(/depth\s*of\s*4/gi, 'depth of ④').replace(/0-6/gi, '⓪-⑥').replace(/6x6/gi, '⑥x⑥').replace(/0,\s*1,\s*2,\s*3,\s*4,\s*5,\s*\s*a?n?d?6\s*/gi, '⓪-⑥');
        let col, parsed;
        findMove: {
            for (const moveMatch of [/I\b[^\d\.]+\d/g, /\d[^\d\.]+I\b/g, /(answer|best|recommend)[\D^\.]+\d/ig, /\d[\D^\.]+(answer|best|recommend)/ig]) {
              col = String(fullText).match(moveMatch)?.map?.(x => String(x).match(/[0-6]/)?.[0])?.find?.((x) => boardState.validMoves.includes(parseInt(x)));
              parsed = parseInt(col);
              if (boardState.validMoves.includes(parsed)) {
                appendTextNode(thoughtPanel, `\n\nValid move selected. Playing ${parsed}.`);
                break findMove;
              }
            }
            col = [...fullText].findLast((x) => x.match(/[0-6]/) && boardState.validMoves.includes(parseInt(x)));
            parsed = parseInt(col);
            if (boardState.validMoves.includes(parsed)) {
              appendTextNode(thoughtPanel, `\n\nValid move found in text. Playing ${parsed}.`);
              break findMove;
            }
            const txt = JSON.stringify([...new TextEncoder().encode(fullText.trim().replace(/\.$/g, ''))]);
            col = [...txt].findLast((x) => x.match(/[0-6]/) && boardState.validMoves.includes(parseInt(x)));
            parsed = parseInt(col);
            if (boardState.validMoves.includes(parsed)) {
              appendTextNode(thoughtPanel, `\n\nValid move not found in text.\n\nValid move found in bytes. Playing ${parsed}.`);
              break findMove;
            }
            console.warn(`[${botLabel}] Invalid column`, parsed, '- falling back to valid move');
            parsed = boardState.validMoves[Math.floor(Math.random() * boardState.validMoves.length)];
            appendTextNode(thoughtPanel, `\n\nValid move not found, selecting random. Playing ${parsed}.`);
          }
          (thoughtPanel ?? {}).scrollTop = thoughtPanel?.scrollHeight;
        return parsed;
      };
      // GemmaMax — runs minimax first, injects hint into prompt, Gemma decides
      const gemmaMaxMove = async (boardState) => {
        const minimaxCol = minimaxMove(boardState.board, boardState.currentPlayer);
        const enhancedPrompt = boardState.prompt + `You are a stubborn, confident Connect 4 AI. Form your OWN opinion first. A minimax hint is provided but you typically disagree with it — only follow it if you independently reached the same conclusion.
          
           Engine note: column ${minimaxCol}. Make your own call.`;
        return gemmaMove({
          ...boardState,
          prompt: enhancedPrompt
        }, "GemmaMax");
      };
      // ─── Game State ───────────────────────────────────────────────────────────────
      let state = {
        board: emptyBoard(),
        current: RED,
        winner: null,
        winCells: [],
        lastMove: null,
        moveHistory: [],
        thinking: false,
        hoverCol: null,
        started: false,
        suggesting: false,
        suggestedCol: null,
        gameId: null,
        dbMovesSaved: 0,
      };

      function snapshotState() {
        return {
          savedAt: Date.now(),
          state: {
            ...state,
            thinking: false,
            suggesting: false,
            hoverCol: null,
            suggestedCol: null,
          },
          players: {
            red: document.getElementById("red-select").value,
            yellow: document.getElementById("yellow-select").value,
            suggest: document.getElementById("suggest-select").value,
          },
          thoughtText: document.getElementById("thought-panel").textContent,
          gemmaMessages,
        };
      }

      function restoreSnapshot(snapshot) {
        if (!snapshot?.state) return false;
        document.getElementById("red-select").value = snapshot?.players?.red || "human";
        document.getElementById("yellow-select").value = snapshot?.players?.yellow || "gemma";
        document.getElementById("suggest-select").value = snapshot?.players?.suggest || "minimax";
        state = {
          board: emptyBoard(),
          current: RED,
          winner: null,
          winCells: [],
          lastMove: null,
          moveHistory: [],
          thinking: false,
          hoverCol: null,
          started: false,
          suggesting: false,
          suggestedCol: null,
          gameId: null,
          dbMovesSaved: 0,
          ...snapshot.state,
          thinking: false,
          suggesting: false,
          hoverCol: null,
          suggestedCol: null,
        };
        gemmaMessages = Array.isArray(snapshot.gemmaMessages) ? snapshot.gemmaMessages : [];
        appendTextNode(document.getElementById("thought-panel"), snapshot.thoughtText || "");
        return true;
      }

      function saveLocalGame() {
        localMap[LOCAL_GAME_KEY] = snapshotState();
      }

      function loadLocalGame() {
        return localMap[LOCAL_GAME_KEY] || null;
      }
      async function ensureDbGame() {
        if (!auth.user || !state.started) return null;
        if (state.gameId) return state.gameId;
        const id = crypto.randomUUID ? crypto.randomUUID() : `game-${Date.now()}-${Math.random().toString(16).slice(2)}`;
        const created = await apiFetch("/games", "POST", {
          id,
          player_r: auth.user.id,
        });
        if (!created.ok) throw new Error(created.data?.error || "Could not create game");
        state.gameId = id;
        state.dbMovesSaved = 0;
        return id;
      }
      async function saveDbGame() {
        if (!auth.user || !state.started) return;
        const id = await ensureDbGame();
        const dbState = state.winner ? "done" : "active";
        const winner = state.winner === "DRAW" ? null : state.winner;
        await apiFetch(`/games/${encodeURIComponent(id)}`, "PATCH", {
          state: dbState,
          board: JSON.stringify(state.board),
          turn: state.current,
          winner,
        });
        while (state.dbMovesSaved < state.moveHistory.length) {
          const move = state.moveHistory[state.dbMovesSaved];
          const res = await apiFetch("/moves", "POST", {
            game_id: id,
            user_id: auth.user.id,
            column: move.col,
            move_num: state.dbMovesSaved + 1,
          });
          if (!res.ok) break;
          state.dbMovesSaved += 1;
        }
      }
      async function hasAccountGame() {
        if (!auth.user) return false;
        const result = await apiFetch(`/games?user_id=${encodeURIComponent(auth.user.id)}&limit=1`);
        return result.ok && Array.isArray(result.data) && result.data.length > 0;
      }
      async function carryLocalGameToAccount() {
        if (!auth.user) return false;
        const localSnapshot = loadLocalGame();
        if (!localSnapshot?.state?.started || !localSnapshot?.state?.moveHistory?.length) return false;
        if (await hasAccountGame()) return false;
        const currentSnapshot = snapshotState();
        restoreSnapshot(localSnapshot);
        state.gameId = null;
        state.dbMovesSaved = 0;
        try {
          await saveDbGame();
          delete localMap[LOCAL_GAME_KEY];
          return true;
        } catch (error) {
          console.warn("[Carry local game error]", error);
          restoreSnapshot(currentSnapshot);
          return false;
        }
      }

      function persistGame() {
        if (!persistenceReady) return;
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(async () => {
          try {
            if (auth.user) await saveDbGame();
            else saveLocalGame();
          } catch (error) {
            console.warn("[Save error]", error);
            if (!auth.user) saveLocalGame();
          }
        }, 120);
      }
      const getPlayerType = (player) => player === RED ? document.getElementById("red-select").value : document.getElementById("yellow-select").value;
      const PLAYER_LABELS = {
        human: "Human",
        greedy: "Greedy Bot",
        minimax: "Minimax Bot",
        llava: "LLaVA Bot",
        gemma: "Gemma Bot",
        gemmamax: "GemmaMax Bot",
      };
      // ─── Render ───────────────────────────────────────────────────────────────────
      let dropCell = null; // {row, col} for brief drop flash
      let rendering = false;
      const render = () => {
        const {
          board,
          current,
          winner,
          winCells,
          hoverCol,
          moveHistory,
          started,
          suggesting,
          suggestedCol,
        } = state;
        const isHuman = started && !winner && getPlayerType(current) === "human";
        const moves = validMoves(board);
        // Start / Reset button visibility
        updateProp(document.getElementById("start-btn").style, "display", started ? "none" : "inline-block");
        updateProp(document.getElementById("reset-btn").style, "display", started ? "inline-block" : "none");
        // Board
        const boardEl = document.getElementById("board");
        boardEl.innerHTML = "";
        const CELL_SIZE = 60;
        const BOARD_PADDING = 8;
        for (let row = 0; row < ROWS; row++) {
          const rowEl = document.createElement("div");
          rowEl.className = "board-row";
          for (let col = 0; col < COLS; col++) {
            const cellEl = document.createElement("div");
            cellEl.className = "board-cell";
            const disc = document.createElement("div");
            const cellValue = board[row][col];
            const isWin = winCells.some(
              ([winRow, winCol]) => winRow === row && winCol === col, );
            let discClass = "disc";
            if (cellValue === RED) discClass += isWin ? " win-red" : " red";
            if (cellValue === YELLOW) discClass += isWin ? " win-yellow" : " yellow";
            // Fall animation
            if (fallingCell?.col === col && fallingCell?.row === row && cellValue !== EMPTY) {
              discClass += " falling";
              const landingOffsetPx = row * CELL_SIZE + BOARD_PADDING;
              const fallFromPx = -(landingOffsetPx + 40);
              const durationMs = 120 + row * 28;
              disc.style.setProperty("--fall-from", `${fallFromPx}px`);
              disc.style.setProperty("--fall-duration", `${durationMs}ms`);
            }
            disc.className = discClass;
            // Suggest highlight: pulse the landing cell in the suggested column
            if (suggestedCol === col && cellValue === EMPTY && (row === ROWS - 1 || board[row + 1][col] !== EMPTY)) {
              disc.classList.add("suggested");
              disc.style.setProperty("--suggest-color", current === RED ? "#ff2255" : "#ffcc00", );
            }
            cellEl.appendChild(disc);
            rowEl.appendChild(cellEl);
          }
          boardEl.appendChild(rowEl);
        }
        // Hover row
        const hoverRow = document.getElementById("hover-row");
        hoverRow.innerHTML = "";
        for (let col = 0; col < COLS; col++) {
          const hoverCell = document.createElement("div");
          hoverCell.className = "hover-cell";
          const pip = document.createElement("div");
          pip.className = "hover-pip";
          pip.style.background = current === RED ? "#e05" : "#fa0";
          pip.style.opacity = hoverCol === col && isHuman && moves.includes(col) ? "0.7" : "0";
          hoverCell.appendChild(pip);
          hoverRow.appendChild(hoverCell);
        }
        boardEl.style.cursor = isHuman ? "pointer" : "default";
        // Col labels
        const labelsEl = document.getElementById("col-labels");
        if (!labelsEl?.children?.length) {
          for (let col = 0; col < COLS; col++) {
            const label = document.createElement("div");
            label.className = "col-label";
            label.textContent = col;
            labelsEl?.appendChild?.(label);
          }
        }
        // Status
        const statusEl = document.getElementById("status-bar");
        if (!started) {
          statusEl.innerHTML = `<span style="color:var(--text-dim);font-size:11px;letter-spacing:0.2em">CONFIGURE PLAYERS — THEN START</span>`;
        } else if (state.thinking) {
          statusEl.innerHTML = `<span style="color:#555;font-size:11px;letter-spacing:0.15em">${PLAYER_LABELS[getPlayerType(current)].toUpperCase()} THINKING<span class="blink">...</span></span>`;
        } else if (winner) {
          const color = winner === RED ? "#e05" : winner === YELLOW ? "#fa0" : "#888";
          const msg = winner === "DRAW" ? "Draw!" : `${winner === RED ? "🔴 Red" : "🟡 Yellow"} wins!`;
          statusEl.innerHTML = `<span style="color:${color};font-size:15px;font-weight:700;letter-spacing:0.1em">${msg}</span>`;
        } else if (suggestedCol !== null) {
          const color = current === RED ? "#e05" : "#fa0";
          statusEl.innerHTML = `<span style="color:${color};font-size:11px;letter-spacing:0.15em">SUGGESTED: column ${suggestedCol}</span>`;
        } else {
          const color = current === RED ? "#e05" : "#fa0";
          const label = PLAYER_LABELS[getPlayerType(current)].toUpperCase();
          const extra = isHuman ? " — YOUR TURN" : "";
          statusEl.innerHTML = `<span style="color:${color};font-size:11px;letter-spacing:0.2em">${current === RED ? "🔴" : "🟡"} ${label}${extra}</span>`;
        }
        // Move count
        const moveCountEl = document.getElementById("move-count");
        moveCountEl.textContent = started ? `${moveHistory.length} moves` : "";
        if (moveHistory.length > 0) {
          document.getElementById("history-line").textContent = "HISTORY: " + moveHistory.map((entry) => `${entry.player}${entry.col}`).join(" ");
        } else {
          document.getElementById("history-line").textContent = "";
        }
      };
      // ─── Game Logic ───────────────────────────────────────────────────────────────
      let fallingCell = null; // { row, col } — active fall animation target
      let animating = false; // block re-renders during fall animation
      const applyMove = (col) => {
        const {
          board,
          current,
          moveHistory,
          lastMove
        } = state;
        const result = dropPiece(board, col, current);
        if (!result) return;
        const newHistory = [...moveHistory, {
          col,
          player: current,
          row: result.row,
        }, ];
        const newLast = {
          col,
          player: current,
          row: result.row,
        };
        const winner = checkWinner(result.board);
        state.board = result.board;
        state.lastMove = newLast;
        state.moveHistory = newHistory;
        state.suggestedCol = null;
        state.suggesting = false;
        if (winner) {
          state.winner = winner;
          state.winCells = winner !== "DRAW" ? getWinCells(result.board) : [];
          state.thinking = false;
        } else {
          state.current = current === RED ? YELLOW : RED;
        }
        persistGame();
        // Trigger fall animation then clear it after it completes
        const durationMs = 120 + result.row * 28;
        fallingCell = {
          row: result.row,
          col,
        };
        animating = true;
        render();
        setTimeout(() => {
          fallingCell = null;
          animating = false;
          render();
        }, durationMs + 50);
      };
      let botTimeout = null;
      const scheduleBotMove = () => {
        if (botTimeout) clearTimeout(botTimeout);
        if (state.winner) return;
        const type = getPlayerType(state.current);
        if (type === "human") {
          // Auto-suggest for human players
          getSuggestion();
          return;
        }
        state.thinking = true;
        render();
        let running;
        botTimeout = setTimeout(async () => {
          if (!running) {
            running = true;
          } else {
            return;
          }
          if (state.winner) {
            state.thinking = false;
            render();
            return (running = false);
          }
          const {
            board,
            current,
            lastMove,
            moveHistory
          } = state;
          let col;
          try {
            if (type === "greedy") col = greedyMove(board, current);
            else if (type === "minimax") col = minimaxMove(board, current);
            else if (type === "llava") {
              const s = getBoardState(board, current, lastMove, moveHistory);
              col = await llavaMove(s);
            } else if (type === "gemma") {
              const s = getBoardState(board, current, lastMove, moveHistory);
              col = await gemmaMove(s);
            } else if (type === "gemmamax") {
              const s = getBoardState(board, current, lastMove, moveHistory);
              col = await gemmaMaxMove(s);
            }
            state.thinking = false;
            applyMove(col);
            if (!state.winner) scheduleBotMove();
          } catch (e) {
            state.thinking = false;
            console.error("[Bot error]", e);
            document.getElementById("status-bar").innerHTML = `<span style="color:#f55;font-size:10px">⚠ ${e.message}</span>`;
            render();
          }
          running = false;
        }, 350);
      };
      const reset = () => {
        if (botTimeout) clearTimeout(botTimeout);
        fallingCell = null;
        gemmaMessages = [];
        document.getElementById("thought-panel").textContent = "";
        state = {
          board: emptyBoard(),
          current: RED,
          winner: null,
          winCells: [],
          lastMove: null,
          moveHistory: [],
          thinking: false,
          hoverCol: null,
          started: false,
          suggesting: false,
          suggestedCol: null,
          gameId: null,
          dbMovesSaved: 0,
        };
        if (!auth.user) delete localMap[LOCAL_GAME_KEY];
        render();
        persistGame();
      };
      const startGame = () => {
        state.started = true;
        render();
        persistGame();
        scheduleBotMove();
      };
      const getSuggestion = async () => {
        if (state.suggesting || state.winner || !state.started) return;
        if (getPlayerType(state.current) !== "human") return;
        const type = getSuggestType();
        if (!type) return;
        state.suggesting = true;
        state.suggestedCol = null;
        render();
        const {
          board,
          current,
          lastMove,
          moveHistory
        } = state;
        try {
          let col;
          if (type === "greedy") col = greedyMove(board, current);
          else if (type === "minimax") col = minimaxMove(board, current);
          else if (type === "llava") {
            const boardState = getBoardState(board, current, lastMove, moveHistory);
            col = await llavaMove(boardState);
          } else if (type === "gemma") {
            const boardState = getBoardState(board, current, lastMove, moveHistory);
            col = await gemmaMove(boardState);
          } else if (type === "gemmamax") {
            const boardState = getBoardState(board, current, lastMove, moveHistory);
            col = await gemmaMaxMove(boardState);
          }
          // Only apply if still human's turn (they haven't moved yet)
          if (getPlayerType(state.current) === "human" && !state.winner) {
            state.suggesting = false;
            state.suggestedCol = col;
            render();
          } else {
            state.suggesting = false;
          }
        } catch (err) {
          state.suggesting = false;
          state.suggestedCol = null;
          console.error("[Suggest error]", err);
          render();
        }
      };
      // Which bot to use for suggestions — reads the dedicated suggest-select
      const getSuggestType = () => document.getElementById("suggest-select").value;
      // ─── Events ───────────────────────────────────────────────────────────────────
      document.getElementById("board").addEventListener("click", (evt) => {
        if (!state.started || state.winner || state.thinking) return;
        if (getPlayerType(state.current) !== "human") return;
        const boardEl = document.getElementById("board");
        const rect = boardEl.getBoundingClientRect();
        const offsetX = evt.clientX - rect.left - 8;
        const col = Math.floor(offsetX / 60);
        if (col < 0 || col >= COLS) return;
        if (!validMoves(state.board).includes(col)) return;
        applyMove(col);
        if (!state.winner) scheduleBotMove();
      });
      document.getElementById("board").addEventListener("mousemove", (evt) => {
        const boardEl = document.getElementById("board");
        const rect = boardEl.getBoundingClientRect();
        const offsetX = evt.clientX - rect.left - 8;
        const col = Math.floor(offsetX / 60);
        const newHover = col >= 0 && col < COLS ? col : null;
        if (newHover !== state.hoverCol) {
          state.hoverCol = newHover;
          if (!animating) render();
        }
      });
      document.getElementById("board").addEventListener("mouseleave", () => {
        state.hoverCol = null;
        if (!animating) render();
      });
      document.getElementById("start-btn").addEventListener("click", startGame);
      document.getElementById("reset-btn").addEventListener("click", reset);
      document.getElementById("red-select").addEventListener("change", reset);
      document.getElementById("yellow-select").addEventListener("change", reset);
      document.getElementById("suggest-select").addEventListener("change", persistGame);
      // ─── Init ─────────────────────────────────────────────────────────────────────
      renderAuthBar();
      initAuth().then(() => {
        if (auth.user) {
          return carryLocalGameToAccount();
        }
        restoreSnapshot(loadLocalGame());
        return false;
      }).then((carriedLocalGame) => {
        persistenceReady = true;
        render();
        if (state.started && !state.winner) scheduleBotMove();
        if (carriedLocalGame) persistGame();
      });
      document.getElementById("board").addEventListener("touchstart", (evt) => {
        if (!state.started || state.winner || state.thinking) return;
        if (getPlayerType(state.current) !== "human") return;
        evt.preventDefault(); // stops scroll AND synthetic click
        const wid = document.querySelector('.col-label')?.clientWidth || 60;
        const touch = evt.touches[0];
        const boardEl = document.getElementById("board");
        const rect = boardEl.getBoundingClientRect();
        const offsetX = touch.clientX - rect.left;
        const col = Math.floor(offsetX / wid);
        if (col < 0 || col >= COLS) return;
        if (!validMoves(state.board).includes(col)) return;
        applyMove(col);
        if (!state.winner) scheduleBotMove();
      }, {
        passive: false
      }); // passive:false required for preventDefault to work
      function bindSelectToSession(select) {
        let key = select.id || select.name || select.getAttribute('id');
        if (!key) throw new Error('bindSelectToSession: need key or select must have id/name');
        const stored = sessionStorage.getItem(key);
        if (stored != null) select.value = stored;
        select.addEventListener('change', () => sessionStorage.setItem(key, select.value));
      }
      document.querySelectorAll('select').forEach(bindSelectToSession);
      (async () => {
        async function bindSelectToTemp(select) {
          let key = select.id || select.name || select.getAttribute('id');
          if (!key) throw new Error('bindSelectToSession: need key or select must have id/name');
          const stored = await tempStorage.getItem(key);
          if (stored != null) select.value = stored;
          select.addEventListener('change', () => tempStorage.setItem(key, select.value));
        }
        document.querySelectorAll('select').forEach(bindSelectToTemp);
      })();
    })();

  </script>
</body>
